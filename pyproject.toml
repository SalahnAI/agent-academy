[project]
name = "agent-academy"
version = "0.1.0"
description = "A multi-agent AI tutor (planner, teacher, quizzer, coach) built with LangGraph human-in-the-loop and local LLMs via Ollama"
readme = "README.md"
authors = [
    { name = "Salah", email = "salah-eddine.nifa@telecom-paris.fr" }
]
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.3.14",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.9",
    "rich>=15.0.0",
]

[project.scripts]
agent-academy = "agent_academy.cli:main"

[build-system]
requires = ["uv_build>=0.11.30,<0.12.0"]
build-backend = "uv_build"
